name: Release

# Push a tag like v0.2.0 (see README → Releasing): checks, multi-arch images, GitHub release.
on:
  push:
    tags: ["v*.*.*"]

env:
  IMAGE_REPO: maltenow/freezer-manager

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ matrix.app }}-${{ steps.version.outputs.version }}
            ${{ env.IMAGE_REPO }}:${{ matrix.app }}-latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
