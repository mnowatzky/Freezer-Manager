# Static file server for the built PWA (TLS and /api routing are done by nginx proxy manager).
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # Must revalidate so new deploys are picked up by the service worker.
  location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  types {
    application/wasm wasm;
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;
}
