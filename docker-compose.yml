# Production (VPS). TLS and routing are handled by the existing nginx proxy manager (NPM),
# which reaches these services over the shared external Docker network. No ports are published.
#
# NPM proxy hosts (see README → Production):
#   ${FREEZER_HOST}         → freezer-web:8080, custom location /api → freezer-api:3000
#   ${SYNC_HOST}            → freezer-zero:4848  (enable "Websockets Support")
#   (only with the bundled Pocket ID) its host → freezer-pocket-id:1411
#
# Pocket ID: by default the app uses an existing, external Pocket ID instance (POCKET_ID_URL).
# To run Pocket ID in this stack instead, set COMPOSE_PROFILES=bundled-pocket-id (see README).
#
# Startup order (via healthchecks): postgres → migrate (one-off) → api → zero-cache.
name: freezer

x-api-build: &api-build
  build: { context: ., dockerfile: apps/api/Dockerfile }
  image: ${IMAGE_REPO:-maltenow/freezer-manager}:api-${IMAGE_TAG:-latest}

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: freezer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: freezer
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freezer -d freezer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-off: applies pending Drizzle migrations (incl. the zero_app publication), then exits.
  # api and zero-cache only start after it finished successfully.
  migrate:
    <<: *api-build
    command: ["node", "--enable-source-maps", "dist/migrate.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://freezer:${POSTGRES_PASSWORD}@postgres:5432/freezer
    networks: [internal]
    restart: "no"

  api:
    <<: *api-build
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://freezer:${POSTGRES_PASSWORD}@postgres:5432/freezer
      WEB_ORIGIN: https://${FREEZER_HOST:-freezer.malte-nowatzky.de}
      # Session cookie for freezer.<domain> and sync.freezer.<domain> (zero-cache forwards it to the API).
      COOKIE_DOMAIN: ${FREEZER_HOST:-freezer.malte-nowatzky.de}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # Public Pocket ID URL (issuer; browsers and the OIDC token exchange use it).
      POCKET_ID_URL: ${POCKET_ID_URL:?set POCKET_ID_URL, e.g. https://oidc.example.com}
      # Optional: how the API reaches Pocket ID for discovery + signup links if different
      # (bundled instance: http://pocket-id:1411). Empty = POCKET_ID_URL.
      POCKET_ID_INTERNAL_URL: ${POCKET_ID_INTERNAL_URL:-}
      POCKET_ID_CLIENT_ID: ${POCKET_ID_CLIENT_ID:?set POCKET_ID_CLIENT_ID}
      POCKET_ID_CLIENT_SECRET: ${POCKET_ID_CLIENT_SECRET:?set POCKET_ID_CLIENT_SECRET}
      POCKET_ID_API_KEY: ${POCKET_ID_API_KEY:-}
      # Optional: comma-separated Pocket ID group IDs that people signing up via an invite join.
      POCKET_ID_SIGNUP_GROUP_IDS: ${POCKET_ID_SIGNUP_GROUP_IDS:-}
      # Optional: code that lets people without an invite create an account on the login page.
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      ZERO_API_KEY: ${ZERO_API_KEY:?set ZERO_API_KEY}
    # Healthcheck: defined in apps/api/Dockerfile (GET /api/health).
    networks:
      internal:
      proxy: { aliases: [freezer-api] }
    restart: unless-stopped

  zero-cache:
    image: rocicorp/zero:1.10.0
    depends_on:
      migrate: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    environment:
      ZERO_UPSTREAM_DB: postgres://freezer:${POSTGRES_PASSWORD}@postgres:5432/freezer
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_APP_PUBLICATIONS: zero_app
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?set ZERO_ADMIN_PASSWORD}
      ZERO_QUERY_URL: http://api:3000/api/zero/query
      ZERO_MUTATE_URL: http://api:3000/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_QUERY_API_KEY: ${ZERO_API_KEY}
      ZERO_MUTATE_API_KEY: ${ZERO_API_KEY}
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
    volumes: [zero-replica:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4848/"]
      interval: 15s
      timeout: 3s
      retries: 3
      # Initial replication of the database can take a while.
      start_period: 60s
    networks:
      internal:
      proxy: { aliases: [freezer-zero] }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ZERO_CACHE_URL: https://${SYNC_HOST:-sync.freezer.malte-nowatzky.de}
        VITE_PUBLIC_URL: https://${FREEZER_HOST:-freezer.malte-nowatzky.de}
    image: ${IMAGE_REPO:-maltenow/freezer-manager}:web-${IMAGE_TAG:-latest}
    environment:
      # Allowed in the Content-Security-Policy (connect-src, https + wss).
      ZERO_ORIGIN: https://${SYNC_HOST:-sync.freezer.malte-nowatzky.de}
    # Healthcheck: defined in apps/web/Dockerfile (GET /healthz).
    networks:
      proxy: { aliases: [freezer-web] }
    restart: unless-stopped

  # Optional bundled Pocket ID (COMPOSE_PROFILES=bundled-pocket-id). Not started otherwise.
  pocket-id:
    profiles: ["bundled-pocket-id"]
    image: ghcr.io/pocket-id/pocket-id:v2.18.0
    environment:
      APP_URL: ${POCKET_ID_URL}
      # Required when this profile is used; Pocket ID refuses to start without it.
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY:-}
      TRUST_PROXY: "true"
      UI_CONFIG_DISABLED: "true"
      ALLOW_USER_SIGNUPS: withToken
      EMAILS_VERIFIED: "true"
    volumes: [pocket-id-data:/app/data]
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      internal:
      proxy: { aliases: [freezer-pocket-id] }
    restart: unless-stopped

volumes:
  pgdata:
  zero-replica:
  pocket-id-data:

networks:
  internal: {}
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_proxy}
